name: Publish existing ASM Tool v0.12.3 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-current-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publish only the already verified existing release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-list --count HEAD)" = 2
          release_assets="$(gh release view v0.12.3 --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' \
            ASM_Tool_0.12.3-Linux-Windows.zip \
            ASM_Tool_0.12.3-linux-x86_64.zip \
            ASM_Tool_0.12.3-windows-x64.zip \
            SHA256SUMS | sort)"
          test "$release_assets" = "$expected"
          gh release edit v0.12.3 \
            --title "ASM Tool 0.12.3" \
            --notes "ASM Tool 0.12.3 for Linux x86-64 (CLI) and Windows x64 (CLI and GUI). Download the platform ZIP, unpack it completely and verify using SHA256SUMS. Source code and MIT LICENSE are in main; third-party notices accompany the distribution. Full runtime/security certification is not claimed." \
            --draft=false
          gh release view v0.12.3 --json isDraft,tagName,assets --jq \
            '{draft:.isDraft, tag:.tagName, files:[.assets[].name]}'
          test "$(gh release view v0.12.3 --json isDraft --jq .isDraft)" = false
      - name: Remove this one-time publishing workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-current-release.yml
          git commit -m "chore: remove one-time release publishing workflow"
          git push origin HEAD:main
