name: ASM 0.12.3 legacy combined root audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/license-0.12.3-20261023
    paths:
      - .github/workflows/asm-0123-legacy-combined-audit.yml

permissions:
  contents: read

jobs:
  read-legacy-combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact historical combined ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/665538865" \
            > historical-combined.zip
          printf '%s  %s\n' \
            'fdd111db5de8320dce4a0d65b751be8fb8f1d96bea0c53a86eb00e0fe8970dc5' \
            'historical-combined.zip' | sha256sum -c -
      - name: Show original root entries and platform inventory counts
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("historical-combined.zip")
          names=[x.filename for x in z.infolist() if not x.is_dir()]
          roots=sorted(n for n in names if not n.startswith(("linux-x86_64/","windows-x64/")))
          print("ARCHIVE_ENTRIES_TOTAL:",len(names))
          print("PLATFORM_LINUX:",sum(n.startswith("linux-x86_64/") for n in names))
          print("PLATFORM_WINDOWS:",sum(n.startswith("windows-x64/") for n in names))
          print("ROOT_ENTRIES:",len(roots))
          for item in roots:
              print("ROOT_ITEM:",repr(item))
          if len(set(names)) != len(names):
              raise SystemExit("duplicate ZIP entries")
          PY
