name: ASM Tool 0.12.3 Go regression

on:
  workflow_dispatch:
  push:
    branches:
      - audit/license-0.12.3-20261023
    paths:
      - .github/workflows/asm-0123-regression.yml

permissions:
  contents: read

jobs:
  go-linux-tests:
    name: Linux full Go tests (short, pinned fonts)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GOTELEMETRY: off
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Acquire SHA-256-pinned DejaVu fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-work/inputs
          gh api -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/665538871" \
            > ci-work/inputs/ASM_Tool_0.12.3-linux-x86_64.zip
          printf '%s  %s\n' \
            '695d48df48d8b840f5e8ac240b3a29a025d61b85511b8458fa9de5246d19046a' \
            'ci-work/inputs/ASM_Tool_0.12.3-linux-x86_64.zip' | sha256sum -c -
          python3 tools/ci/portable_candidate.py extract-fonts \
            --archive ci-work/inputs/ASM_Tool_0.12.3-linux-x86_64.zip \
            --out ci-work/pinned-fonts
          echo "ASM_PORTABLE_TEST_FONT_DIR=${PWD}/ci-work/pinned-fonts" >> "$GITHUB_ENV"
      - name: Run complete short Go suite on Linux
        shell: bash
        run: |
          set -euo pipefail
          go test -short -count=1 ./...

  go-windows-tests:
    name: Windows native Go tests (short)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      GOTELEMETRY: off
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run complete short Go suite on Windows
        shell: pwsh
        run: |
          go test -short -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go test suite failed on Windows' }
